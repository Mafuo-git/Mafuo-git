<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Matheo Merlin</title>
  <desc id="description">Engineering graduate, future motorsport engineer.</desc>
  <defs>
    <pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="#111111"/>
      <rect width="80" height="80" fill="#eeeeee"/>
      <rect x="80" y="80" width="80" height="80" fill="#eeeeee"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-160 0" dur="12s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="shade" x2="1" y2="1">
      <stop stop-color="#000000" stop-opacity=".68"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".82"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#shade)"/>
  <text x="600" y="148" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" text-anchor="middle">MATHEO MERLIN</text>
  <text x="600" y="202" fill="#e10600" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="3" text-anchor="middle">ENGINEERING GRADUATE · FUTURE MOTORSPORT ENGINEER</text>
</svg>
